<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .muscle-path {
        transition: fill 300ms ease;
        cursor: pointer;
      }
      .muscle-path:hover {
        opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Upper Back -->
  <path id="muscle-upper_back" class="muscle-path"
    d="M70,70 Q100,65 130,70 L125,100 Q100,105 75,100 Z" />

  <!-- Lats -->
  <path id="muscle-lats" class="muscle-path"
